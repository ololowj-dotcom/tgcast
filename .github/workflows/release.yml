name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build tgcast.exe
        run: python -m PyInstaller --onefile --name tgcast --console --noconfirm --collect-submodules telethon --distpath dist --workpath build --specpath build packaging/tgcast_exe.py
      - name: Smoke test
        shell: cmd
        run: |
          dist\tgcast.exe --version
          dist\tgcast.exe --help
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item dist\tgcast.exe release\
          Copy-Item packaging\README-windows.txt release\README.txt
          Compress-Archive -Path release\* -DestinationPath tgcast-windows.zip -Force
          $hash = (Get-FileHash tgcast-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  tgcast-windows.zip" | Out-File -Encoding ascii SHA256SUMS.txt
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" tgcast-windows.zip SHA256SUMS.txt \
            --title "tgcast ${GITHUB_REF_NAME#v}" --notes-file packaging/RELEASE_NOTES.md \
            || gh release upload "$GITHUB_REF_NAME" tgcast-windows.zip SHA256SUMS.txt --clobber
