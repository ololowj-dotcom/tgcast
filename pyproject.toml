[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tgcast"
version = "1.1.0"
description = "Mailing to your base of Telegram chats: post one message to every channel and group in your list, carefully - with previews, permission checks, safe pauses and limits, and no repeats."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["telegram", "telethon", "mailing", "broadcast", "chats", "channels", "groups", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Chat",
]
dependencies = ["telethon>=1.34", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
tgcast = "tgcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "UP006", "UP007", "UP031", "UP035", "UP045", "B008"]
